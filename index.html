<body>
  <noscript>
    <p class="noscript">Reel Time requires JavaScript to load the scene library and play the clock.</p>
  </noscript>

  <main id="app" class="app" aria-live="polite">
    <video id="scene" class="projection__video" aria-label="Movie scene currently telling the time" playsinline
      webkit-playsinline muted preload="auto"></video>
    <div class="projection__noise" aria-hidden="true"></div>
    <div class="app__room-light" aria-hidden="true"></div>

    <section id="startPanel" class="panel panel--start" aria-labelledby="appTitle">
      <div id="posterWall" class="poster-wall" aria-hidden="true"></div>
      <h1 id="appTitle" class="start-title">Reel Time</h1>
      <p id="startMessage" class="panel__copy">Loading scene library...</p>
      <button id="startButton" class="button" type="button" aria-describedby="startMessage" disabled>
        <svg class="button__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true" focusable="false">
          <path d="M14 9l6 6-6 6"></path>
          <path d="M4 4v7a4 4 0 0 0 4 4h11"></path>
        </svg>
        <span>What time is it Hollywood?</span>
      </button>
    </section>

    <section id="countdown" class="panel panel--countdown" aria-label="Countdown" hidden>
      <div class="countdown-mark" aria-hidden="true"></div>
      <div id="countdownNumber" class="countdown-number">3</div>
    </section>

    <section id="titleCard" class="panel panel--title" aria-labelledby="movieTitle" hidden>
      <div class="title-kicker">
        <p class="eyebrow">Now playing</p>
        <p id="sceneMatch" class="title-match"></p>
      </div>
      <h2 id="movieTitle">Reel Time</h2>
      <p id="rightsIntro" class="panel__copy"></p>
    </section>

    <section id="idle" class="panel panel--idle" aria-labelledby="localTime" hidden>
      <div class="time-stack">
        <h2 id="localTime">--:--:--</h2>
        <p id="localTimeAmPm" class="time-ampm">--:--:-- --</p>
      </div>
      <p id="idleMessage" class="panel__copy">Waiting for the next scene. Grab some pop-corn.</p>
    </section>

    <div id="volumeControl" class="volume-control" hidden>
      <label class="volume-control__label" for="volumeRange">Volume</label>
      <input id="volumeRange" class="volume-control__range" type="range" min="0" max="100" value="80" step="1">
      <span id="volumeValue" class="volume-control__value">80%</span>
    </div>

          </path>
          <path class="signature-logo-pupil" fill="currentColor"
            d="M770.16,474.71c-.01,.36-.03,.72-.06,1.08-3.82,75.51-37.01,134.49-77.37,134.49s-73.2-58.38-77.32-133.34c-.01-.36-.04-.72-.06-1.08,20.84-16.98,46.08-29.28,75.96-31.38,33.08-2.34,58.94,10.86,78.86,30.22Z">

          <path class="signature-logo-pupil" fill="currentColor"

          </path>
        </svg>
      </span>
    </a>

    <aside id="playbackStatus" class="status" aria-label="Playback details" hidden>
      <div id="currentCredit" class="status__credit" hidden>
        <p id="overlayMovie" class="status__movie"></p>
        <p id="overlayRights" class="status__rights"></p>
      </div>
      <button id="replayButton" class="button button--replay" type="button" aria-label="Replay the last scene" hidden>
        <svg class="button__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true" focusable="false">
          <path d="M2.5 2v6h6"></path>
          <path d="M2.66 15.57a10 10 0 1 0 .57-8.38"></path>
        </svg>
        <span>Replay scene</span>
      </button>
      <div id="nextCountdown" class="status__next" hidden>
        <span>Next scene</span>
        <strong id="nextTimer">--:--</strong>
      </div>
    </aside>
  </main>

  <script src="assets/data/scenes-data.js"></script>
  <script src="assets/js/ascii-printer.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>

</html>
